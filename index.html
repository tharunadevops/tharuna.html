<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎨 Cartoon Channel · Colorful TV</title>
  <!-- Google Font for a fun, rounded look -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(145deg, #f9e0ff 0%, #c8f0ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* floating background bubbles */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(2px);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
      pointer-events: none;
      z-index: 0;
    }

    .bubble:nth-child(1) { width: 200px; height: 200px; top: -40px; left: -60px; background: radial-gradient(circle at 30% 30%, #ffe97a, #ffb347); opacity: 0.5; }
    .bubble:nth-child(2) { width: 300px; height: 300px; bottom: -100px; right: -80px; background: radial-gradient(circle at 70% 20%, #b4f0a0, #2ecc71); opacity: 0.3; }
    .bubble:nth-child(3) { width: 150px; height: 150px; top: 20%; right: 10%; background: radial-gradient(circle at 40% 40%, #ff9a9e, #fd6e8a); opacity: 0.4; }
    .bubble:nth-child(4) { width: 250px; height: 250px; bottom: 10%; left: -80px; background: radial-gradient(circle at 60% 60%, #a18cd1, #7f7fd5); opacity: 0.3; }

    /* main card / channel screen */
    .tv-card {
      position: relative;
      z-index: 5;
      max-width: 1100px;
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      border-radius: 70px 70px 50px 50px;
      box-shadow: 0 30px 45px -20px rgba(0, 0, 0, 0.4), 
                  0 0 0 8px #fff9e6, 
                  0 0 0 12px #ffcc00, 
                  0 0 0 16px #ff6b6b;
      padding: 2.8rem 2.5rem 2.5rem;
      border: 3px solid rgba(255, 255, 255, 0.9);
      transition: transform 0.2s ease;
    }

    .tv-card:hover {
      transform: scale(1.005);
    }

    /* header area */
    .channel-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      gap: 1rem;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-icon {
      font-size: 3.8rem;
      line-height: 1;
      filter: drop-shadow(0 6px 0 #d4a017);
      transform: rotate(-5deg);
    }

    .channel-title {
      font-family: 'Fredoka One', cursive;
      font-size: 3.2rem;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fd1d1d, #fcb045, #833ab4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 4px 4px 0 rgba(255, 215, 0, 0.4);
      line-height: 1.1;
    }

    .channel-title span {
      display: block;
      font-size: 1.1rem;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #2b5876, #4e4376);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: none;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      margin-top: 5px;
    }

    .live-badge {
      background: #ff3b3b;
      color: white;
      font-weight: 800;
      font-size: 1.4rem;
      padding: 0.6rem 1.8rem;
      border-radius: 60px;
      box-shadow: 0 8px 0 #b91c1c, 0 12px 20px -8px black;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 2px solid #fff3b0;
      transform: rotate(2deg);
    }

    .live-badge::before {
      content: "🔴";
      font-size: 1.6rem;
      filter: drop-shadow(0 2px 2px white);
    }

    /* cartoon character row */
    .character-strip {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 2rem;
      margin: 1.5rem 0 2rem;
      flex-wrap: wrap;
    }

    .char {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s ease;
      cursor: pointer;
      filter: drop-shadow(0 12px 10px rgba(0, 0, 0, 0.15));
    }

    .char:hover {
      transform: translateY(-10px) scale(1.05);
    }

    .char-emoji {
      font-size: 5rem;
      background: #ffeaa7;
      width: 120px;
      height: 120px;
      border-radius: 40% 60% 30% 70% / 50% 40% 60% 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 5px solid #ffb347;
      box-shadow: 0 12px 0 #c27e1a, 0 18px 25px -8px #7b4b1a;
      background: linear-gradient(145deg, #fff7d6, #ffe28c);
      margin-bottom: 10px;
    }

    .char-emoji.blue {
      background: linear-gradient(145deg, #b3e5fc, #81d4fa);
      border-color: #29b6f6;
      box-shadow: 0 12px 0 #0d47a1, 0 18px 25px -8px #0b3b6b;
    }

    .char-emoji.pink {
      background: linear-gradient(145deg, #ffcdd2, #f8bbd0);
      border-color: #ec407a;
      box-shadow: 0 12px 0 #ad1457, 0 18px 25px -8px #880e4f;
    }

    .char-emoji.green {
      background: linear-gradient(145deg, #d0f0c0, #a5d6a7);
      border-color: #66bb6a;
      box-shadow: 0 12px 0 #2e7d32, 0 18px 25px -8px #1b5e20;
    }

    .char-name {
      font-weight: 800;
      font-size: 1.5rem;
      color: #2d1b4e;
      background: #fff9c4;
      padding: 0.3rem 1.5rem;
      border-radius: 40px;
      border: 3px solid #ffb74d;
      box-shadow: 0 5px 0 #b26500;
      margin-top: 5px;
    }

    /* shows grid */
    .show-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1.8rem;
      margin: 2.5rem 0 1.8rem;
    }

    .show-card {
      background: #ffffffdd;
      backdrop-filter: blur(4px);
      border-radius: 40px;
      padding: 1.5rem 1rem 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 4px solid white;
      box-shadow: 0 12px 0 #c0a0d0, 0 18px 30px -12px #2e1a47;
      transition: all 0.15s ease;
      transform: rotate(0deg);
    }

    .show-card:hover {
      transform: scale(1.03) rotate(0.5deg);
      box-shadow: 0 14px 0 #9b7bb8, 0 22px 35px -10px #3a2352;
    }

    .show-emoji {
      font-size: 3.8rem;
      margin-bottom: 0.5rem;
      filter: drop-shadow(0 6px 4px rgba(0,0,0,0.1));
    }

    .show-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.7rem;
      color: #4a1b6e;
      text-align: center;
      line-height: 1.2;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 0 #ffd966;
    }

    .show-time {
      background: #ffb347;
      color: #3a1a0a;
      font-weight: 800;
      font-size: 1.2rem;
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      border: 2px solid white;
      box-shadow: 0 5px 0 #b15f00;
      margin-top: auto;
    }

    /* footer / schedule ticker */
    .schedule-ticker {
      background: linear-gradient(120deg, #2b2b2b, #5f2c82);
      color: #fff9c4;
      padding: 1.2rem 1.8rem;
      border-radius: 60px;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      border: 4px solid #f9d371;
      box-shadow: inset 0 -5px 0 #3a1f5e, 0 12px 0 #2a1240, 0 18px 25px -8px #190b28;
      font-weight: 700;
      font-size: 1.2rem;
      text-align: center;
    }

    .ticker-label {
      background: #ffd966;
      color: #1f1f2e;
      font-family: 'Fredoka One', cursive;
      padding: 0.4rem 1.6rem;
      border-radius: 40px;
      font-size: 1.4rem;
      letter-spacing: 1px;
      box-shadow: 0 4px 0 #a77b00;
    }

    .ticker-text {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem 1.8rem;
    }

    .ticker-text span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Responsive tweaks */
    @media (max-width: 700px) {
      .tv-card {
        padding: 1.5rem 1.2rem;
        border-radius: 50px;
        box-shadow: 0 20px 30px -15px black, 0 0 0 6px #fff9e6, 0 0 0 10px #ffcc00, 0 0 0 13px #ff6b6b;
      }
      .channel-title { font-size: 2.4rem; }
      .logo-icon { font-size: 2.8rem; }
      .live-badge { font-size: 1rem; padding: 0.4rem 1.2rem; }
      .char-emoji { width: 85px; height: 85px; font-size: 3.5rem; }
      .char-name { font-size: 1.2rem; }
      .show-title { font-size: 1.4rem; }
      .schedule-ticker { font-size: 1rem; padding: 1rem; }
    }
  </style>
</head>
<body>
  <!-- floating background bubbles (colorful) -->
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <!-- MAIN TV CARD / CHANNEL INTERFACE -->
  <div class="tv-card">
    
    <!-- header with logo & live badge -->
    <div class="channel-header">
      <div class="logo-area">
        <div class="logo-icon">📺</div>
        <div class="channel-title">
          CARTOON<br>CHANNEL
          <span>🎈 24/7 FUN 🎈</span>
        </div>
      </div>
      <div class="live-badge">LIVE NOW</div>
    </div>

    <!-- cartoon character row (hosts / mascots) -->
    <div class="character-strip">
      <div class="char">
        <div class="char-emoji">🐵</div>
        <div class="char-name">Momo</div>
      </div>
      <div class="char">
        <div class="char-emoji blue">🐧</div>
        <div class="char-name">Pingu</div>
      </div>
      <div class="char">
        <div class="char-emoji pink">🦊</div>
        <div class="char-name">Foxy</div>
      </div>
      <div class="char">
        <div class="char-emoji green">🐸</div>
        <div class="char-name">Froggy</div>
      </div>
    </div>

    <!-- SHOWS GRID – colorful cards with cartoon titles -->
    <div class="show-grid">
      <!-- Show 1 -->
      <div class="show-card">
        <div class="show-emoji">🚀🐱</div>
        <div class="show-title">Space<br>Kittens</div>
        <div class="show-time">10:30 AM</div>
      </div>
      <!-- Show 2 -->
      <div class="show-card">
        <div class="show-emoji">🦖🌈</div>
        <div class="show-title">Dino<br>Rainbow</div>
        <div class="show-time">12:00 PM</div>
      </div>
      <!-- Show 3 -->
      <div class="show-card">
        <div class="show-emoji">🐙🎨</div>
        <div class="show-title">Octo<br>Art</div>
        <div class="show-time">2:15 PM</div>
      </div>
      <!-- Show 4 -->
      <div class="show-card">
        <div class="show-emoji">🦸‍♂️🍕</div>
        <div class="show-title">Pizza<br>Heroes</div>
        <div class="show-time">4:30 PM</div>
      </div>
    </div>

    <!-- bottom schedule ticker with bright colors -->
    <div class="schedule-ticker">
      <div class="ticker-label">📅 TODAY</div>
      <div class="ticker-text">
        <span>🎬 9:00 Looney Tunes</span>
        <span>⚡ 11:30 Pokémon</span>
        <span>🐭 1:00 Tom & Jerry</span>
        <span>🌟 3:30 SpongeBob</span>
        <span>🎉 6:00 Movie Time</span>
      </div>
    </div>

  </div> <!-- end tv-card -->

</body>
</html>
